<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Thời Gian App Của Ong 🍀</title>
    <style>
        :root {
            --bg-color: #f4fbf5;
            --card-bg: #ffffff;
            --bright-red: #ff3333;
            --dark-red: #cc0000;
            --light-red: #ffe6e6;
            --border-red: #ff8080;
            --bright-green: #00cc44;
            --dark-green: #00882d;
            --light-green: #e6ffe6;
            --border-green: #66ff99;
            --text-main: #222222;
            --text-sub: #555555;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,204,68,0.15);
            border: 2px solid var(--border-green);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--bright-red);
            font-size: 24px;
            margin: 0 0 6px 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .header p {
            font-size: 13px;
            color: var(--dark-green);
            font-weight: bold;
            margin: 0;
        }

        .section-card {
            background: var(--light-green);
            border: 2px solid var(--border-green);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 18px;
        }

        .section-title {
            font-weight: bold;
            font-size: 15px;
            color: var(--dark-green);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        label {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
            display: block;
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #bbb;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 13px;
            font-weight: bold;
        }

        .app-selector-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: #ffffff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-green);
            margin-bottom: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .checkbox-item input {
            width: auto;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 15px;
        }

        .btn-convert {
            background-color: var(--bright-green);
            color: white;
            box-shadow: 0 3px 8px rgba(0,204,68,0.3);
        }

        .btn-convert:hover {
            background-color: var(--dark-green);
        }

        .app-card {
            background: var(--card-bg);
            border: 2px solid var(--border-red);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(255,51,51,0.08);
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .app-title {
            font-size: 17px;
            font-weight: bold;
            color: var(--bright-red);
        }

        .app-time-badge {
            background: var(--light-green);
            color: var(--dark-green);
            border: 2px solid var(--bright-green);
            padding: 4px 14px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 17px;
        }

        .app-details {
            font-size: 11px;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 10px;
            background: var(--light-red);
            padding: 6px 10px;
            border-radius: 6px;
        }

        .quick-add {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            align-items: center;
        }

        .quick-add label {
            font-size: 11px;
            margin: 0;
            white-space: nowrap;
        }

        .btn-small {
            padding: 5px 10px;
            font-size: 11px;
            border: 1px solid var(--bright-green);
            background: var(--light-green);
            color: var(--dark-green);
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-small:hover {
            background: var(--bright-green);
            color: white;
        }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .input-btn-group {
            display: flex;
            gap: 4px;
        }

        .input-btn-group input {
            width: 60px;
            padding: 4px 6px;
            font-size: 12px;
        }

        .btn-sub {
            background: var(--light-red);
            color: var(--dark-red);
            border: 1px solid var(--border-red);
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            flex-grow: 1;
            font-weight: bold;
        }

        .btn-borrow {
            background: #fff3e0;
            color: #e65100;
            border: 1px solid #ffe0b2;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            flex-grow: 1;
            font-weight: bold;
        }

        .footer-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-end-day {
            background: var(--bright-green);
            color: white;
        }

        .btn-reset {
            background: var(--bright-red);
            color: white;
        }

        .result-box {
            background: #ffffff;
            border: 2px dashed var(--bright-green);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--dark-green);
            margin-top: 10px;
            display: none;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Quản Lý Thời Gian App Của Ong 🍀✨</h1>
        <p>Học 9:1 • Phân bổ bội số 5p • Vay 1:9 • Dồn dư 1t ➔ +30p (๑•̀ㅂ•́)o✧</p>
    </div>

    <!-- Quy đổi thời gian học tiếng Nhật -->
    <div class="section-card">
        <div class="section-title">🇯🇵 Quy Đổi Học Tiếng Nhật ➔ Phút App (Tỷ lệ 9:1)</div>
        
        <div class="form-group">
            <div>
                <label>⏱️ Thời gian đã học tập:</label>
                <input type="number" id="studyVal" placeholder="Nhập số..." value="3" min="0" step="0.5">
            </div>
            <div>
                <label>Đơn vị:</label>
                <select id="studyUnit">
                    <option value="hours">Tiếng (Giờ)</option>
                    <option value="mins">Phút</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <div>
                <label>📋 Kế hoạch hàng ngày (%):</label>
                <input type="number" id="planPercent" value="50" min="0" max="100">
            </div>
            <div>
                <label>🌱 Thói quen hàng ngày (%):</label>
                <input type="number" id="habitPercent" value="50" min="0" max="100">
            </div>
        </div>

        <label>🎯 Chọn các App muốn nhận phân bổ thưởng:</label>
        <div class="app-selector-grid">
            <label class="checkbox-item"><input type="checkbox" id="chk_tiktok"> TikTok 🎵</label>
            <label class="checkbox-item"><input type="checkbox" id="chk_sudoku" checked> Sudoku 🧩</label>
            <label class="checkbox-item"><input type="checkbox" id="chk_killer" checked> Killer Sudoku 🔢</label>
            <label class="checkbox-item"><input type="checkbox" id="chk_nonogram" checked> Nonogram 🖼️</label>
        </div>

        <div style="margin-bottom: 12px;">
            <label>⚙️ Kiểu phân bổ phút thưởng (Chỉ cộng bội số 5):</label>
            <select id="distMode">
                <option value="even">Chia đều (Tự động cân đối bước 5p khi lẻ)</option>
                <option value="random">Tự do / Ngẫu nhiên (Chia ngẫu nhiên nấc 5p)</option>
            </select>
        </div>

        <button class="btn btn-convert" onclick="calculateAndDistribute()">✨ Quy Đổi & Phân Bổ Ngay 🍀</button>
        <div id="resultBox" class="result-box"></div>
    </div>

    <!-- Danh Sách App -->
    <div id="appList">
        <!-- Render bằng JS -->
    </div>

    <!-- Thao tác ngày -->
    <div class="footer-actions">
        <button class="btn btn-end-day" onclick="endDay()">🌙 Kết Thúc Ngày (Gộp dư 1 tiếng ➔ +30p Thưởng) 🍀</button>
        <button class="btn btn-reset" onclick="resetAll()">🔄 Reset Tất Cả Mặc Định 10 Phút</button>
    </div>
</div>

<script>
    const initialAppsData = {
        tiktok: { name: 'TikTok 🎵', default: 10, bonus: 0, manual: 0, used: 0, borrowed: 0 },
        sudoku: { name: 'Sudoku 🧩', default: 10, bonus: 0, manual: 0, used: 0, borrowed: 0 },
        killer_sudoku: { name: 'Killer Sudoku 🔢', default: 10, bonus: 0, manual: 0, used: 0, borrowed: 0 },
        nonogram: { name: 'Nonogram 🖼️', default: 10, bonus: 0, manual: 0, used: 0, borrowed: 0 }
    };

    let apps = JSON.parse(JSON.stringify(initialAppsData));

    function getGoalBonus(percent) {
        if (percent < 30) return 0;
        if (percent < 50) return 5;
        if (percent < 60) return 10;
        if (percent < 70) return 15;
        if (percent < 80) return 20;
        if (percent < 90) return 25;
        return 30; // 90% - 100%
    }

    function calculateAndDistribute() {
        const val = parseFloat(document.getElementById('studyVal').value) || 0;
        const unit = document.getElementById('studyUnit').value;
        const studyMins = unit === 'hours' ? Math.round(val * 60) : val;

        // Tỷ lệ học mới 9:1 & làm tròn xuống bội số của 5
        let studyBonus = Math.floor(studyMins / 9);
        studyBonus = Math.floor(studyBonus / 5) * 5; 

        const planPercent = parseInt(document.getElementById('planPercent').value) || 0;
        const habitPercent = parseInt(document.getElementById('habitPercent').value) || 0;
        const planBonus = getGoalBonus(planPercent);
        const habitBonus = getGoalBonus(habitPercent);

        const totalBonus = studyBonus + planBonus + habitBonus;

        let selectedKeys = [];
        if (document.getElementById('chk_tiktok').checked) selectedKeys.push('tiktok');
        if (document.getElementById('chk_sudoku').checked) selectedKeys.push('sudoku');
        if (document.getElementById('chk_killer').checked) selectedKeys.push('killer_sudoku');
        if (document.getElementById('chk_nonogram').checked) selectedKeys.push('nonogram');

        if (selectedKeys.length === 0) {
            alert("Bạn vui lòng tick chọn ít nhất 1 App để nhận phân bổ thời gian nhé! (｡•́‿•̀｡)");
            return;
        }

        Object.keys(apps).forEach(key => apps[key].bonus = 0);

        const distMode = document.getElementById('distMode').value;
        let totalSteps = Math.floor(totalBonus / 5);

        if (distMode === 'even') {
            let baseStepsPerApp = Math.floor(totalSteps / selectedKeys.length);
            let remSteps = totalSteps % selectedKeys.length;

            selectedKeys.forEach((key, index) => {
                let appSteps = baseStepsPerApp + (index < remSteps ? 1 : 0);
                apps[key].bonus = appSteps * 5;
            });
        } else if (distMode === 'random') {
            let allocSteps = new Array(selectedKeys.length).fill(0);
            for (let i = 0; i < totalSteps; i++) {
                let r = Math.floor(Math.random() * selectedKeys.length);
                allocSteps[r]++;
            }
            selectedKeys.forEach((key, index) => {
                apps[key].bonus = allocSteps[index] * 5;
            });
        }

        const resBox = document.getElementById('resultBox');
        resBox.style.display = 'block';
        resBox.innerHTML = `🎉 <b>KẾT QUẢ QUY ĐỔI & PHÂN BỔ:</b><br>` +
            `• Học tiếng Nhật (${studyMins} phút ➔ tỷ lệ 9:1): +${studyBonus}p<br>` +
            `• Kế hoạch (${planPercent}%): +${planBonus}p | Thói quen (${habitPercent}%): +${habitBonus}p<br>` +
            `➔ <b>Tổng thưởng: +${totalBonus} phút!</b> *(Phân bổ bội số 5p tới ${selectedKeys.length} App đã chọn)* (⁠≧⁠▽⁠≦⁠)`;

        renderApps();
    }

    function addManual(appKey, mins) {
        apps[appKey].manual += mins;
        renderApps();
    }

    function subUsed(appKey) {
        const input = document.getElementById(`used_input_${appKey}`);
        const val = parseInt(input.value) || 0;
        if (val > 0) {
            apps[appKey].used += val;
            input.value = '';
            renderApps();
        }
    }

    function borrowTime(appKey) {
        const input = document.getElementById(`borrow_input_${appKey}`);
        const val = parseInt(input.value) || 0;
        if (val > 0) {
            apps[appKey].borrowed += val;
            input.value = '';
            renderApps();
        }
    }

    function calculateAppTotal(app) {
        return app.default + app.bonus + app.manual + app.borrowed - app.used;
    }

    function renderApps() {
        const container = document.getElementById('appList');
        container.innerHTML = '';

        Object.keys(apps).forEach(key => {
            const app = apps[key];
            const totalMins = calculateAppTotal(app);
            const tomorrowDeduct = app.borrowed * 9;

            const cardHtml = `
                <div class="app-card">
                    <div class="app-header">
                        <span class="app-title">${app.name}</span>
                        <span class="app-time-badge">${totalMins} phút</span>
                    </div>
                    <div class="app-details">
                        📌 Mặc định: ${app.default}p | 🎁 Thưởng: +${app.bonus + app.manual}p 
                        | ⚠ Vay nhận: +${app.borrowed}p (Mai trừ: -${tomorrowDeduct}p) 
                        | ⌛ Đã dùng: -${app.used}p
                    </div>
                    
                    <div class="quick-add">
                        <label>➕ Thưởng thủ công:</label>
                        <button class="btn-small" onclick="addManual('${key}', 5)">+5p</button>
                        <button class="btn-small" onclick="addManual('${key}', 10)">+10p</button>
                        <button class="btn-small" onclick="addManual('${key}', 15)">+15p</button>
                        <button class="btn-small" onclick="addManual('${key}', 20)">+20p</button>
                    </div>

                    <div class="action-row">
                        <div class="input-btn-group">
                            <input type="number" id="used_input_${key}" placeholder="Phút">
                            <button class="btn-sub" onclick="subUsed('${key}')">➖ Trừ đã chơi</button>
                        </div>
                        <div class="input-btn-group">
                            <input type="number" id="borrow_input_${key}" placeholder="Phút">
                            <button class="btn-borrow" onclick="borrowTime('${key}')">⚠ Vay (Tỷ lệ 1:9)</button>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += cardHtml;
        });
    }

    function endDay() {
        let totalLeftover = 0;
        Object.keys(apps).forEach(key => {
            let currentMins = calculateAppTotal(apps[key]);
            if (currentMins > 0) {
                totalLeftover += currentMins;
            }
        });

        let hoursLeft = Math.floor(totalLeftover / 60);
        let bonusTomorrow = hoursLeft * 30;
        let minsRemaining = totalLeftover % 60;

        alert(`🌙 KẾT THÚC NGÀY! 🍀\n\n` +
              `• Tổng thời gian giải trí còn dư: ${totalLeftover} phút (${hoursLeft} tiếng ${minsRemaining} phút)\n` +
              `• Thưởng gộp dư (1 tiếng dư ➔ +30p thưởng): +${bonusTomorrow} phút cho ngày mai! 🏆✨\n\n` +
              `Chúc bạn nghỉ ngơi vui vẻ và tiếp tục giữ vững kỷ luật cao độ nhé! ( •̀ ω •́ )✧`);
    }

    function resetAll() {
        if (confirm("Bạn có chắc muốn Reset tất cả các App về mặc định 10 phút không? 🍀")) {
            apps = JSON.parse(JSON.stringify(initialAppsData));
            document.getElementById('resultBox').style.display = 'none';
            renderApps();
        }
    }

    renderApps();
</script>

</body>
</html>
